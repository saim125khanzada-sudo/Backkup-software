name: Build Desktop Clients (Windows .exe & macOS .dmg)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # macOS Build: Compiles .app and creates .dmg
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: client/requirements.txt

      - name: Install Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt

      - name: Build macOS .app Bundle
        run: |
          pyinstaller --noconfirm --windowed \
            --name "EnterpriseBackupAgent" \
            --hidden-import "pystray" \
            --hidden-import "watchdog.observers" \
            --hidden-import "PIL" \
            --hidden-import "tkinter" \
            client/client_daemon.py

      - name: Package into Apple Disk Image (.dmg)
        run: |
          mkdir -p dmg_staging
          cp -R dist/EnterpriseBackupAgent.app dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create -volname "Enterprise Backup Agent" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            dist/EnterpriseBackupAgent.dmg
          
          rm -rf dmg_staging

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnterpriseBackupAgent-macOS-DMG
          path: dist/EnterpriseBackupAgent.dmg
          retention-days: 30

  # ==========================================
  # Windows Build: Compiles standalone .exe
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: client/requirements.txt

      - name: Install Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt

      - name: Build Windows .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "EnterpriseBackupAgent" `
            --hidden-import "pystray" `
            --hidden-import "watchdog.observers" `
            --hidden-import "PIL" `
            --hidden-import "tkinter" `
            client/client_daemon.py

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnterpriseBackupAgent-Windows-EXE
          path: dist/EnterpriseBackupAgent.exe
          retention-days: 30